realtime:
  title: Realtime
  subtitle: Persistent connections opened by hx-sse and hx-ws; a reconnect banner appears at the top while a stream is down.
  # channel.label is a leaf beside the channel names below, for the same reason.
  # channel.label 与下方的频道名同为叶子，理由同上。
  channel:
    label: Channel
    audit: Audit events
    orders: Order events
  events.title: Event stream
  events.hint: Each event is appended in arrival order and the rest of the workspace stays untouched.
  sse:
    title: Server-Sent Events
    badge: Server push
    hint: A one-way stream, well suited to notifications and logs.
    log: Event log
    placeholder: Waiting for server events…
  ws:
    title: WebSocket
    badge: Two-way channel
    hint: A two-way stream, well suited to collaboration and commands.
    label: Payload
    log: Message log
    placeholder: Waiting for server messages…
    placeholder_input: Type the message to send…
    send: Send
  status:
    open: Connected
    connecting: Connecting
    closed: Disconnected
    idle: Idle
    reconnecting: The stream is down; reconnecting…
    failed: The stream is down and automatic reconnection has stopped
    offline: The network is offline; reconnecting once it returns
    recovered: The realtime connection is restored

i18n:
  title: Internationalisation
  subtitle: Two catalogues drive both the server render and the in-place client switch.
  switch:
    title: Language switch
    hint: Switching the language refetches the workspace through htmx; the page itself never reloads.
  current: Current language
  samples:
    title: Message samples
  sample:
    greeting_label: Plain message
    greeting: Hello, world!
    interpolated_label: Message with an argument
    interpolated: 'Welcome back, {{.name}}!'
    missing_label: Fallback of a missing key (shows the key itself)
  format:
    title: Numbers and dates
    hint: Numbers, percentages, currency and dates are formatted with Intl in the active language.
    number: Number
    percent: Percentage
    currency: Currency
    date: Date
    datetime: Date and time
  persist:
    title: Preference persistence
    field: Preferred language
    hint: The choice is stored in localStorage and the yd_lang cookie, so a reload keeps it.

error:
