dashboard:
  title: Dashboard
  subtitle: Key metrics, recent activity and shortcuts inside your tenant.
  # range.label is a leaf beside the options below: a message named range would shadow its own children once flattened.
  # range.label 与下面的选项同为叶子：range 若既是消息又是父级，摊平后会与其子键相互遮蔽。
  range:
    label: Time range
    "24h": Last 24 hours
    "7d": Last 7 days
    "30d": Last 30 days
  kpi.empty: No metric in the selected range
  kpi.users: Active users
  kpi.users_trend: versus the previous period
  recent.title: Recent activity
  recent.all: View all users

