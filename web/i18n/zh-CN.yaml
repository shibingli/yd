# yd 管理后台中文语言目录 | yd admin shell Chinese message catalogue
#
# 键名一律为小写点分路径，与 web/templates/** 中的 {{tr "..."}}、data-yd-i18n 与
# data-yd-i18n-attr 一一对应；加载时键名由 viper 统一归一化为小写，
# 因此 lang.zh-CN 与 lang.zh-cn 是同一个键。
# Keys are lower-case dotted paths matching every {{tr "..."}}, data-yd-i18n and
# data-yd-i18n-attr under web/templates/**; the loader lower-cases keys, so lang.zh-CN
# and lang.zh-cn are one and the same key.
#
# 缺失键的回退顺序为「当前语言 → 默认语言 → 键名本身」，因此这里少写一个键
# 会让页面上直接出现键名，TestEveryTrKeyHasBothCatalogs 会拦住这种情况。
# A missing key falls back through "current language -> default language -> the key itself",
# so an omission shows the bare key on the page; TestEveryTrKeyHasBothCatalogs blocks that.
