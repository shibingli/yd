{{/*
  pages/blog_page.html —— 公开独立单页：标题、更新时间与正文。
  pages/blog_page.html — the public standalone page: title, update time and body.
  数据契约 | Data contract: .Article（model.CMSArticle）。
*/}}
<article class="yd-page" data-yd-page="blog-page" aria-labelledby="yd-blog-page-title">
  <header class="yd-page__header">
    <div>
      <h1 class="yd-page__title" id="yd-blog-page-title">{{ .Article.Title }}</h1>
      <p class="yd-page__subtitle">{{ tr "field.updated" }} {{ humanTime .Article.UpdatedAt }}</p>
    </div>
  </header>
  <section class="yd-card yd-section yd-prose">{{ .Article.Body }}</section>
</article>
