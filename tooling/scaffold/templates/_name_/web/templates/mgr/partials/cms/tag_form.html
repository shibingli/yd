{{/*
  partials/cms/tag_form.html —— 标签新建/编辑抽屉表单。
  partials/cms/tag_form.html — the tag create/edit drawer form.
  数据契约 | Data contract: .Tag、.Mode、.Action。
*/}}
<form class="yd-form" method="post" action="{{ .Action }}" hx-post="{{ .Action }}"
      hx-target="#yd-workspace" hx-swap="innerMorph" hx-push-url="false"
      hx-status:400="target:#yd-drawer-errors swap:innerHTML"
      hx-status:409="target:#yd-drawer-errors swap:innerHTML"
      hx-status:403="target:#yd-drawer-errors swap:innerHTML"
      hx-status:404="target:#yd-drawer-errors swap:innerHTML"
      hx-status:422="target:#yd-drawer-errors swap:innerHTML"
      data-yd-confirm="{{ tr "cms.confirm.save" }}">
  <div class="yd-form__field">
    <label class="yd-form__label" for="yd-cms-tag-name">{{ tr "field.name" }}</label>
    <input class="yd-input" id="yd-cms-tag-name" name="name" type="text" required maxlength="80" value="{{ .Tag.Name }}">
  </div>
  <div class="yd-form__field">
    <label class="yd-form__label" for="yd-cms-tag-slug">{{ tr "field.slug" }}</label>
    <input class="yd-input" id="yd-cms-tag-slug" name="slug" type="text" maxlength="80" value="{{ .Tag.Slug }}">
  </div>
  <div class="yd-form__actions">
    <button type="submit" class="yd-btn yd-btn--primary">{{ tr "ui.save" }}</button>
  </div>
</form>
